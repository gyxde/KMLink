name: Build and Release

on:
  push:
    branches: [main, develop]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            architecture: x64
          - os: macos-15
            platform: macos-arm64
            architecture: arm64
          - os: macos-15-intel
            platform: macos-x64
            architecture: x64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      KMLINK_PLATFORM: ${{ matrix.platform }}
      KMLINK_ARCH: ${{ matrix.architecture }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate version and architecture
        id: version
        shell: python
        run: |
          import ast
          import os
          import platform
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?', version):
              raise SystemExit('Use a filename-safe semantic version in pyproject.toml.')
          source_version = next(ast.literal_eval(node.value) for node in ast.parse(Path('src/kmlink/__init__.py').read_text(encoding='utf-8')).body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets))
          if source_version != version:
              raise SystemExit('Package and application versions differ.')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag must equal v + the application version.')
          machine = platform.machine().lower()
          accepted = {'x64': {'amd64', 'x86_64'}, 'arm64': {'arm64', 'aarch64'}}
          if machine not in accepted[os.environ['KMLINK_ARCH']]:
              raise SystemExit(f'Unexpected Python architecture: {machine}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'KMLink {version} - {os.environ["KMLINK_PLATFORM"]}\n')

      - name: Build Intel macOS crypto with static OpenSSL
        if: matrix.platform == 'macos-x64'
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          requirements = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['dependencies']
          requirement = next(item for item in requirements if item.startswith('cryptography'))
          environment = os.environ.copy()
          environment['OPENSSL_DIR'] = subprocess.check_output(['brew', '--prefix', 'openssl@3'], text=True).strip()
          environment['OPENSSL_STATIC'] = '1'
          # Ignore cached dynamic wheels from an earlier macOS build.
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-cache-dir', '--force-reinstall', '--no-binary=cryptography', requirement], env=environment, check=True)
          from cryptography.hazmat.bindings import _rust
          libraries = subprocess.check_output(['otool', '-L', _rust.__file__], text=True)
          print(libraries)
          if re.search(r'lib(?:ssl|crypto)[^/\n]*\.dylib', libraries, re.IGNORECASE):
              raise SystemExit('Intel cryptography must statically link OpenSSL before packaging.')

      - name: Install runtime and build dependencies
        run: python -m pip install ".[build]"

      - name: Run tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v

      - name: Build native application
        run: python scripts/build.py

      - name: Check packaged application startup
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          executable = Path('dist/KMLink/KMLink.exe') if os.name == 'nt' else Path('dist/KMLink.app/Contents/MacOS/KMLink')
          subprocess.run([str(executable.resolve()), '--smoke-test'], check=True, timeout=25)
          # Updater CLI must be dispatched before importing/starting the GUI.
          result = subprocess.run([str(executable.resolve()), '--apply-update', str(Path('build/missing-update-plan.json').resolve())], timeout=25)
          if result.returncode != 1:
              raise SystemExit('The frozen update-helper entry did not reject an invalid plan.')

      - name: Package platform download
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path
          output = Path('release-assets')
          output.mkdir(exist_ok=True)
          archive = output / f'KMLink-{os.environ["KMLINK_PLATFORM"]}.zip'
          if os.name == 'nt':
              folder = Path('dist/KMLink')
              shutil.copyfile('README.md', folder / 'README.md')
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as package:
                  for path in sorted(folder.rglob('*')):
                      if path.is_file():
                          package.write(path, path.relative_to('dist').as_posix())
          else:
              # Preserve the app's framework symlinks and executable bits.
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', 'dist/KMLink.app', str(archive)], check=True)
          print(f'Created {archive} ({archive.stat().st_size:,} bytes)')

      - name: Validate self-update archive
        shell: python
        run: |
          import hashlib
          import os
          import subprocess
          import tempfile
          import tomllib
          from pathlib import Path
          from kmlink.updater import ReleaseUpdate, VerifiedArchive, extract_archive
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          archive = Path('release-assets') / f'KMLink-{os.environ["KMLINK_PLATFORM"]}.zip'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          update = ReleaseUpdate(version, 'v' + version, '', '', archive.name, '', archive.stat().st_size, digest, '')
          with tempfile.TemporaryDirectory(prefix='kmlink-update-check-') as temp:
              payload = extract_archive(VerifiedArchive(update, archive, digest), Path(temp) / 'payload')
              if os.name != 'nt':
                  subprocess.run(['codesign', '--verify', '--deep', '--strict', str(payload)], check=True)

      - name: Keep platform downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KMLink-${{ matrix.platform }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK components
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          # Hosted runners may keep their CLI under a versioned directory, not latest or PATH.
          candidates = [sdk / 'cmdline-tools/latest/bin', *sorted((sdk / 'cmdline-tools').glob('*/bin'), reverse=True)]
          tools = next((folder for folder in candidates if (folder / 'android').is_file() or (folder / 'sdkmanager').is_file()), None)
          if tools is None:
              raise SystemExit(f'Android command-line tools were not found under {sdk}.')
          modern = tools / 'android'
          if modern.is_file():
              subprocess.run([str(modern), '--no-metrics', '--sdk=' + str(sdk), 'sdk', 'install', 'platforms/android-36', 'build-tools/35.0.0', 'platform-tools'], check=True)
          else:
              subprocess.run([str(tools / 'sdkmanager'), '--sdk_root=' + str(sdk), 'platforms;android-36', 'build-tools;35.0.0', 'platform-tools'], check=True)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as environment_path:
              environment_path.write(str(tools) + '\n')
          if not (sdk / 'platforms/android-36/android.jar').is_file() or not (sdk / 'build-tools/35.0.0/apksigner').is_file():
              raise SystemExit('Required Android SDK components were not installed.')
          Path('android/gradlew').chmod(0o755)

      - name: Set up Python for protocol interoperability tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install interoperability test dependency
        run: python -m pip install 'cryptography>=44,<51'

      - name: Validate Android version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          source = Path('android/app/build.gradle').read_text(encoding='utf-8')
          match = re.search(r'versionName\s+["\']([^"\']+)["\']', source)
          if not match or match.group(1) != version:
              raise SystemExit('Android and desktop application versions differ.')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag does not match the Android version.')

      - name: Run Android protocol tests
        working-directory: android
        run: ./gradlew --no-daemon :protocol:test :app:testDebugUnitTest

      - name: Test real Java and desktop protocol interoperability
        timeout-minutes: 5
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          result = subprocess.run(['./gradlew', '--no-daemon', '-q', ':protocol:printTestRuntimeClasspath'], cwd='android', check=True, capture_output=True, text=True)
          lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          if not lines:
              raise SystemExit('The Java test classpath was not generated.')
          environment = os.environ.copy()
          environment['KMLINK_JAVA_CLASSPATH'] = lines[-1]
          environment['PYTHONPATH'] = str(Path('src').resolve())
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_android_protocol.py', '-v'], env=environment, check=True)

      - name: Run Android emulator startup smoke test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 15
        run: bash android/run-emulator-smoke.sh

      - name: Keep Android test reports
        if: always() && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/reports/android-smoke.png
            android/app/build/reports/qa/
            android/app/build/reports/emulator.log
            android/app/build/reports/logcat.txt
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KMLINK_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KMLINK_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KMLINK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KMLINK_ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path
          if not all(os.environ.get(key) for key in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')):
              raise SystemExit('Android release signing secrets are required; refusing to publish an unsigned APK.')
          key = Path(os.environ['RUNNER_TEMP']) / 'kmlink-android-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          KMLINK_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kmlink-android-release.jks
          KMLINK_ANDROID_STORE_PASSWORD: ${{ secrets.KMLINK_ANDROID_STORE_PASSWORD }}
          KMLINK_ANDROID_KEY_ALIAS: ${{ secrets.KMLINK_ANDROID_KEY_ALIAS }}
          KMLINK_ANDROID_KEY_PASSWORD: ${{ secrets.KMLINK_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Build development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and collect Android APK
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          from pathlib import Path
          release = os.environ['GITHUB_REF'].startswith('refs/tags/v')
          variant = 'release' if release else 'debug'
          apk = Path(f'android/app/build/outputs/apk/{variant}/app-{variant}.apk')
          sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          subprocess.run([str(sdk / 'apksigner'), 'verify', '--verbose', str(apk)], check=True)
          if release:
              info = subprocess.check_output([str(sdk / 'aapt'), 'dump', 'badging', str(apk)], text=True)
              if 'application-debuggable' in info:
                  raise SystemExit('Refusing to publish a debuggable release APK.')
          output = Path('release-assets')
          output.mkdir(exist_ok=True)
          shutil.copyfile(apk, output / 'KMLink-android.apk')

      - name: Remove temporary signing key
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'kmlink-android-release.jks').unlink(missing_ok=True)

      - name: Keep Android download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KMLink-android
          path: release-assets/KMLink-android.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Collect all platform downloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: KMLink-*
          path: release-assets
          merge-multiple: true

      - name: Create source archive and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import hashlib
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit('Release tag does not match source version.')
          assets = Path('release-assets')
          expected = {f'KMLink-{target}.zip' for target in ('windows-x64', 'macos-arm64', 'macos-x64')}
          if {path.name for path in assets.glob('*.zip')} != expected:
              raise SystemExit('A platform build is missing or unexpected.')
          if not (assets / 'KMLink-android.apk').is_file():
              raise SystemExit('The signed Android release APK is missing.')
          source = assets / 'KMLink-source.zip'
          subprocess.run(['git', 'archive', '--format=zip', '--prefix=KMLink/', f'--output={source}', 'HEAD'], check=True)
          checksums = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}' for path in sorted(assets.iterdir()) if path.suffix in {'.zip', '.apk'}]
          (assets / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          notes = Path('.github/RELEASE_TEMPLATE.md').read_text(encoding='utf-8')
          notes = notes.replace('@VERSION@', version).replace('@TAG@', tag).replace('@REPOSITORY@', os.environ['GITHUB_REPOSITORY'])
          Path('release-notes.md').write_text(notes, encoding='utf-8')

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --title "KMLink ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
